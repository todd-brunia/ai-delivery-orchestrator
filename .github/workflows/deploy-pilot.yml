name: Deploy pilot runtime

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact current main commit and immutable image tag
        required: true
        type: string
      image_digest:
        description: Expected immutable ECR sha256 digest
        required: true
        type: string
      run_migration:
        description: Run the protected migration task after deploy
        required: true
        default: false
        type: boolean
      run_smoke:
        description: Run bounded synthetic infrastructure and worker checks
        required: true
        default: false
        type: boolean
      confirmation:
        description: Type DEPLOY PILOT
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-apply-pilot
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-pilot-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: pilot
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_budget_notification_email: ${{ secrets.BUDGET_NOTIFICATION_EMAIL }}
      TF_VAR_runtime_secret_policy_arn: ${{ vars.RUNTIME_SECRET_POLICY_ARN }}
      TF_VAR_allowed_operator_principal_arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ai-delivery-orchestrator-pilot-human-operator
      TF_VAR_webhook_lambda_role_arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ai-delivery-orchestrator-pilot-webhook
      TF_VAR_operator_lambda_role_arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ai-delivery-orchestrator-pilot-operator-api
      TF_VAR_worker_execution_role_arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ai-delivery-orchestrator-pilot-worker-execution
      TF_VAR_worker_task_role_arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ai-delivery-orchestrator-pilot-worker
      TF_VAR_migration_execution_role_arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ai-delivery-orchestrator-pilot-migration-execution
      TF_VAR_migration_task_role_arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ai-delivery-orchestrator-pilot-migration
      TF_VAR_supervised_dispatch_execution_role_arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ai-delivery-orchestrator-pilot-supervised-dispatch-execution
      TF_VAR_supervised_dispatch_task_role_arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ai-delivery-orchestrator-pilot-supervised-dispatch
      TF_VAR_supervised_github_app_id: ${{ vars.SUPERVISED_GITHUB_APP_ID }}
      TF_VAR_supervised_github_installation_id: ${{ vars.SUPERVISED_GITHUB_INSTALLATION_ID }}
      TF_VAR_supervised_openai_project_id: ${{ vars.SUPERVISED_OPENAI_PROJECT_ID }}
    steps:
      - name: Validate immutable deployment inputs
        env:
          SELECTED_SHA: ${{ inputs.commit_sha }}
          EXPECTED_DIGEST: ${{ inputs.image_digest }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = "DEPLOY PILOT"
          test "${#SELECTED_SHA}" -eq 40
          test -z "${SELECTED_SHA//[0-9a-f]/}"
          test "${#EXPECTED_DIGEST}" -eq 71
          test "${EXPECTED_DIGEST#sha256:}" != "$EXPECTED_DIGEST"
          digest_hex="${EXPECTED_DIGEST#sha256:}"
          test "${#digest_hex}" -eq 64
          test -z "${digest_hex//[0-9a-f]/}"
      - name: Check out exact reviewed main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Verify commit is current main
        env:
          SELECTED_SHA: ${{ inputs.commit_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SELECTED_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$SELECTED_SHA"
      - name: Require exact protected deployment role
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_RUNTIME_DEPLOY_ROLE_ARN: ${{ vars.AWS_RUNTIME_DEPLOY_ROLE_ARN }}
        run: test "$AWS_RUNTIME_DEPLOY_ROLE_ARN" = "arn:aws:iam::$AWS_ACCOUNT_ID:role/ai-delivery-orchestrator-pilot-runtime-deploy"
      - name: Assume protected runtime deployment role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_RUNTIME_DEPLOY_ROLE_ARN }}
          role-duration-seconds: 900
      - name: Assume exact protected Terraform apply role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ai-delivery-orchestrator-terraform-pilot-apply
          role-chaining: true
          role-skip-session-tagging: true
      - name: Verify immutable image digest
        env:
          SELECTED_SHA: ${{ inputs.commit_sha }}
          EXPECTED_DIGEST: ${{ inputs.image_digest }}
        run: |
          observed="$(aws ecr describe-images --repository-name ai-delivery-orchestrator-worker --image-ids "imageTag=$SELECTED_SHA" --query 'imageDetails[0].imageDigest' --output text)"
          test "$observed" = "$EXPECTED_DIGEST"
          echo "image_digest=$observed" >> "$GITHUB_OUTPUT"
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
      - name: Create exact-image saved plan
        env:
          TF_VAR_worker_image_sha: ${{ inputs.commit_sha }}
        run: |
          terraform -chdir=infra/environments/pilot init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform -chdir=infra/environments/pilot plan -input=false -lock-timeout=5m -out=pilot-deploy.tfplan -var="aws_account_id=${{ vars.AWS_ACCOUNT_ID }}"
      - name: Reject destructive or unrelated deployment plan
        run: |
          changes="$(terraform -chdir=infra/environments/pilot show -json pilot-deploy.tfplan | jq -c '[.resource_changes[]? | select(.change.actions != ["no-op"]) | {address,actions:.change.actions}]')"
          disallowed_destructive="$(jq -r '
            def allowed_task_definition_replacement:
              ((.address == "aws_ecs_task_definition.worker" or .address == "aws_ecs_task_definition.migration" or .address == "aws_ecs_task_definition.supervised_dispatch") and .actions == ["delete", "create"]);
            .[] | select(.actions | index("delete")) | select(allowed_task_definition_replacement | not) | .address
          ' <<< "$changes")"
          test -z "$disallowed_destructive"
          unexpected="$(jq -r '.[] | select(.address | test("^(aws_ecs_task_definition\\.(worker|migration|supervised_dispatch)|aws_lambda_function\\.(webhook|operator)|aws_ecs_service\\.worker)$") | not) | .address' <<< "$changes")"
          test -z "$unexpected"
      - name: Apply exact-image saved plan
        run: terraform -chdir=infra/environments/pilot apply -input=false -lock-timeout=5m pilot-deploy.tfplan
      - name: Run protected migrations once
        if: ${{ inputs.run_migration }}
        run: |
          cluster="$(terraform -chdir=infra/environments/pilot output -raw worker_cluster_arn)"
          task="$(terraform -chdir=infra/environments/pilot output -raw migration_task_definition_arn)"
          subnets="$(terraform -chdir=infra/environments/pilot output -json isolated_subnet_ids | jq -r 'join(",")')"
          security_group="$(terraform -chdir=infra/environments/pilot output -raw worker_security_group_id)"
          task_arn="$(aws ecs run-task --cluster "$cluster" --task-definition "$task" --launch-type FARGATE --network-configuration "awsvpcConfiguration={subnets=[$subnets],securityGroups=[$security_group],assignPublicIp=DISABLED}" --count 1 --query 'tasks[0].taskArn' --output text)"
          test "$task_arn" != "None"
          aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$task_arn"
          test "$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task_arn" --query 'tasks[0].containers[0].exitCode' --output text)" = "0"
      - name: Run bounded synthetic smoke checks
        if: ${{ inputs.run_smoke }}
        run: |
          test "${{ vars.OBSERVABILITY_READY }}" = "true"
          aws dynamodb describe-table --table-name ai-delivery-orchestrator-pilot-coordination --query 'Table.TableStatus' --output text | grep -qx ACTIVE
          for queue in commands callbacks; do aws sqs get-queue-attributes --queue-url "$(aws sqs get-queue-url --queue-name "ai-delivery-orchestrator-pilot-$queue.fifo" --query QueueUrl --output text)" --attribute-names ApproximateNumberOfMessages >/dev/null; done
          aws rds describe-db-clusters --db-cluster-identifier ai-delivery-orchestrator-pilot --query 'DBClusters[0].Status' --output text | grep -Eq 'available|starting'
          aws lambda get-function-configuration --function-name ai-delivery-orchestrator-pilot-webhook --query State --output text | grep -qx Active
          aws lambda get-function-configuration --function-name ai-delivery-orchestrator-pilot-operator --query State --output text | grep -qx Active
          cluster="$(terraform -chdir=infra/environments/pilot output -raw worker_cluster_arn)"
          task="$(terraform -chdir=infra/environments/pilot output -raw worker_task_definition_arn)"
          subnets="$(terraform -chdir=infra/environments/pilot output -json isolated_subnet_ids | jq -r 'join(",")')"
          security_group="$(terraform -chdir=infra/environments/pilot output -raw worker_security_group_id)"
          task_arn="$(aws ecs run-task --cluster "$cluster" --task-definition "$task" --launch-type FARGATE --network-configuration "awsvpcConfiguration={subnets=[$subnets],securityGroups=[$security_group],assignPublicIp=DISABLED}" --overrides '{"containerOverrides":[{"name":"worker","command":["node","dist/index.js","--check"]}]}' --query 'tasks[0].taskArn' --output text)"
          aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$task_arn"
          test "$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task_arn" --query 'tasks[0].containers[0].exitCode' --output text)" = "0"
      - name: Return worker service to safe idle
        if: ${{ always() }}
        run: aws ecs update-service --cluster ai-delivery-orchestrator-pilot-worker --service ai-delivery-orchestrator-pilot-worker --desired-count 0 >/dev/null || true
      - name: Record sanitized deployment evidence
        if: ${{ always() }}
        env:
          SELECTED_SHA: ${{ inputs.commit_sha }}
          EXPECTED_DIGEST: ${{ inputs.image_digest }}
        run: |
          echo "### Pilot deployment checkpoint" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$SELECTED_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image digest: \`$EXPECTED_DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Migration requested: \`${{ inputs.run_migration }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Smoke requested: \`${{ inputs.run_smoke }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Final worker desired count: \`0\`" >> "$GITHUB_STEP_SUMMARY"
