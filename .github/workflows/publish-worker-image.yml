name: Publish worker image

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-worker-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish-worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: ai-delivery-orchestrator-worker
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Validate immutable publication inputs
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_ECR_PUBLISH_ROLE_ARN: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          SELECTED_SHA: ${{ github.sha }}
        run: |
          test "${#SELECTED_SHA}" -eq 40
          test -z "${SELECTED_SHA//[0-9a-f]/}"
          test "$(git rev-parse HEAD)" = "$SELECTED_SHA"
          test -n "$AWS_ACCOUNT_ID"
          test "$AWS_ECR_PUBLISH_ROLE_ARN" = "arn:aws:iam::$AWS_ACCOUNT_ID:role/ai-delivery-orchestrator-ecr-publish"

      - name: Assume dedicated publishing role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}

      - name: Require unused immutable tag
        env:
          SELECTED_SHA: ${{ github.sha }}
        run: |
          error_file="$RUNNER_TEMP/ecr-describe-error"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$SELECTED_SHA" > /dev/null 2> "$error_file"; then
            echo "::error::The immutable commit tag already exists; refusing to overwrite or accept it"
            exit 1
          fi
          if ! grep -q "ImageNotFoundException" "$error_file"; then
            echo "::error::Unable to prove that the immutable commit tag is unused"
            exit 1
          fi
          rm "$error_file"

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        with:
          mask-password: "true"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and publish immutable image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          sbom: false
