name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.10-bookworm
        env:
          POSTGRES_DB: orchestrator
          POSTGRES_PASSWORD: local-orchestrator
          POSTGRES_USER: orchestrator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orchestrator -d orchestrator"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://orchestrator:local-orchestrator@127.0.0.1:5432/orchestrator

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Test PostgreSQL integration
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Build container
        run: npm run docker:build
