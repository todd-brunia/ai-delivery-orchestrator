name: Terraform plan

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: pilot-plan
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.AWS_TERRAFORM_PLAN_ROLE_ARN != '' && vars.AWS_ACCOUNT_ID != '' && vars.TF_STATE_BUCKET != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_budget_notification_email: terraform-plan@example.invalid
    steps:
      - name: Require plan configuration
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_TERRAFORM_PLAN_ROLE_ARN: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          test -n "$AWS_ACCOUNT_ID"
          test -n "$AWS_TERRAFORM_PLAN_ROLE_ARN"
          test -n "$TF_STATE_BUCKET"
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
      - name: Assume read-only plan role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
      - name: Initialize pilot IAM remote state
        if: ${{ vars.PILOT_IAM_STATE_ENABLED == 'true' }}
        run: terraform -chdir=infra/environments/pilot-iam init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - name: Initialize pilot IAM with temporary local state
        if: ${{ vars.PILOT_IAM_STATE_ENABLED != 'true' }}
        run: |
          mv infra/environments/pilot-iam/backend.tf infra/environments/pilot-iam/backend.tf.disabled
          terraform -chdir=infra/environments/pilot-iam init -input=false -backend=false
      - name: Create speculative pilot IAM plan
        run: >-
          terraform -chdir=infra/environments/pilot-iam plan -input=false -lock-timeout=5m
          -var="aws_account_id=${{ vars.AWS_ACCOUNT_ID }}"
          -var="command_queue_arn=arn:aws:sqs:us-east-1:${{ vars.AWS_ACCOUNT_ID }}:ai-delivery-orchestrator-pilot-commands.fifo"
          -var="callback_queue_arn=arn:aws:sqs:us-east-1:${{ vars.AWS_ACCOUNT_ID }}:ai-delivery-orchestrator-pilot-callbacks.fifo"
          -var="coordination_table_arn=arn:aws:dynamodb:us-east-1:${{ vars.AWS_ACCOUNT_ID }}:table/ai-delivery-orchestrator-pilot-coordination"
          -var="database_secret_arn=arn:aws:secretsmanager:us-east-1:${{ vars.AWS_ACCOUNT_ID }}:secret:rds!cluster:speculative"
          -var="webhook_secret_arn=arn:aws:secretsmanager:us-east-1:${{ vars.AWS_ACCOUNT_ID }}:secret:ai-delivery-orchestrator/pilot/github-webhook-secret-abcdef"
          -var="worker_ecr_repository_arn=arn:aws:ecr:us-east-1:${{ vars.AWS_ACCOUNT_ID }}:repository/ai-delivery-orchestrator-worker"
          -var="ingress_log_group_arn=arn:aws:logs:us-east-1:${{ vars.AWS_ACCOUNT_ID }}:log-group:/ai-delivery-orchestrator/pilot/ingress"
          -var="operator_log_group_arn=arn:aws:logs:us-east-1:${{ vars.AWS_ACCOUNT_ID }}:log-group:/ai-delivery-orchestrator/pilot/operator-api"
          -var="worker_log_group_arn=arn:aws:logs:us-east-1:${{ vars.AWS_ACCOUNT_ID }}:log-group:/ai-delivery-orchestrator/pilot/worker"
      - name: Initialize pilot remote state
        run: terraform -chdir=infra/environments/pilot init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - name: Create speculative pilot plan
        run: >-
          terraform -chdir=infra/environments/pilot plan -input=false -lock-timeout=5m
          -var="aws_account_id=${{ vars.AWS_ACCOUNT_ID }}"
          -var="runtime_secret_policy_arn=arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:policy/ai-delivery-orchestrator-pilot-runtime-secrets"
          -var="webhook_lambda_role_arn=arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ai-delivery-orchestrator-pilot-webhook"
          -var="operator_lambda_role_arn=arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ai-delivery-orchestrator-pilot-operator-api"
          -var="allowed_operator_principal_arn=arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ai-delivery-orchestrator-pilot-human-operator"
          -var="worker_execution_role_arn=arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ai-delivery-orchestrator-pilot-worker-execution"
          -var="worker_task_role_arn=arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ai-delivery-orchestrator-pilot-worker"
          -var="migration_execution_role_arn=arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ai-delivery-orchestrator-pilot-migration-execution"
          -var="migration_task_role_arn=arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ai-delivery-orchestrator-pilot-migration"
          -var="supervised_dispatch_execution_role_arn=arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ai-delivery-orchestrator-pilot-supervised-dispatch-execution"
          -var="supervised_dispatch_task_role_arn=arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ai-delivery-orchestrator-pilot-supervised-dispatch"
