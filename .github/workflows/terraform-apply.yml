name: Terraform apply

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA from main to provision
        required: true
        type: string
      provision_iam:
        description: Provision the dedicated pilot IAM stack before the main stack
        required: true
        default: false
        type: boolean
      bootstrap_ecr_repository:
        description: Create only the worker ECR repository before the first immutable image exists
        required: true
        default: false
        type: boolean
      replace_ecr_dkr_endpoint:
        description: Replace only the pilot ECR Docker interface endpoint after an approved private-DNS repair
        required: true
        default: false
        type: boolean
      replacement_confirmation:
        description: Required exact confirmation for an approved ECR Docker endpoint replacement
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-apply-pilot
  cancel-in-progress: false

jobs:
  apply:
    name: pilot-apply
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pilot
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_worker_image_sha: ${{ inputs.commit_sha }}
      TF_VAR_budget_notification_email: ${{ secrets.BUDGET_NOTIFICATION_EMAIL }}
      TF_VAR_allowed_operator_principal_arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ai-delivery-orchestrator-pilot-human-operator
    steps:
      - name: Validate selected commit
        env:
          SELECTED_SHA: ${{ inputs.commit_sha }}
        run: test "${#SELECTED_SHA}" -eq 40 && test -z "${SELECTED_SHA//[0-9a-f]/}"
      - name: Require exact ECR Docker endpoint replacement confirmation
        if: ${{ inputs.replace_ecr_dkr_endpoint }}
        env:
          PROVISION_IAM: ${{ inputs.provision_iam }}
          BOOTSTRAP_ECR_REPOSITORY: ${{ inputs.bootstrap_ecr_repository }}
          REPLACEMENT_CONFIRMATION: ${{ inputs.replacement_confirmation }}
        run: |
          test "$PROVISION_IAM" = "false"
          test "$BOOTSTRAP_ECR_REPOSITORY" = "false"
          test "$REPLACEMENT_CONFIRMATION" = "REPLACE ECR DKR ENDPOINT"
      - name: Check out selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Verify commit is on main
        env:
          SELECTED_SHA: ${{ inputs.commit_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SELECTED_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$SELECTED_SHA"
      - name: Require protected environment configuration
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_TERRAFORM_APPLY_ROLE_ARN: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          BUDGET_NOTIFICATION_EMAIL: ${{ secrets.BUDGET_NOTIFICATION_EMAIL }}
          PILOT_IAM_STATE_ENABLED: ${{ vars.PILOT_IAM_STATE_ENABLED }}
          RUNTIME_SECRET_POLICY_ARN: ${{ vars.RUNTIME_SECRET_POLICY_ARN }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          test -n "$AWS_ACCOUNT_ID"
          test -n "$AWS_TERRAFORM_APPLY_ROLE_ARN"
          test -n "$BUDGET_NOTIFICATION_EMAIL"
          test -n "$TF_STATE_BUCKET"
          if [ "${{ inputs.provision_iam }}" = "true" ]; then
            test "$PILOT_IAM_STATE_ENABLED" = "true"
          fi
          if [ "${{ inputs.provision_iam }}" != "true" ]; then
            test "$RUNTIME_SECRET_POLICY_ARN" = "arn:aws:iam::$AWS_ACCOUNT_ID:policy/ai-delivery-orchestrator-pilot-runtime-secrets"
          fi
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
      - name: Assume protected apply role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
      - name: Require published immutable image
        if: ${{ !inputs.bootstrap_ecr_repository }}
        env:
          SELECTED_SHA: ${{ inputs.commit_sha }}
        run: |
          digest="$(aws ecr describe-images --repository-name ai-delivery-orchestrator-worker --image-ids "imageTag=$SELECTED_SHA" --query 'imageDetails[0].imageDigest' --output text)"
          test "${#digest}" -eq 71
          test "${digest#sha256:}" != "$digest"
      - name: Initialize pilot IAM remote state
        if: ${{ inputs.provision_iam }}
        run: terraform -chdir=infra/environments/pilot-iam init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - name: Plan pilot IAM for selected commit
        if: ${{ inputs.provision_iam }}
        run: >-
          terraform -chdir=infra/environments/pilot-iam plan -input=false -lock-timeout=5m -out=pilot-iam.tfplan
          -var="aws_account_id=${{ vars.AWS_ACCOUNT_ID }}"
          -var="command_queue_arn=arn:aws:sqs:us-east-1:${{ vars.AWS_ACCOUNT_ID }}:ai-delivery-orchestrator-pilot-commands.fifo"
          -var="callback_queue_arn=arn:aws:sqs:us-east-1:${{ vars.AWS_ACCOUNT_ID }}:ai-delivery-orchestrator-pilot-callbacks.fifo"
          -var="coordination_table_arn=arn:aws:dynamodb:us-east-1:${{ vars.AWS_ACCOUNT_ID }}:table/ai-delivery-orchestrator-pilot-coordination"
          -var="database_secret_arn=arn:aws:secretsmanager:us-east-1:${{ vars.AWS_ACCOUNT_ID }}:secret:rds!cluster:bootstrap"
          -var="webhook_secret_arn=arn:aws:secretsmanager:us-east-1:${{ vars.AWS_ACCOUNT_ID }}:secret:ai-delivery-orchestrator/pilot/github-webhook-secret-bootstrap"
          -var="worker_ecr_repository_arn=arn:aws:ecr:us-east-1:${{ vars.AWS_ACCOUNT_ID }}:repository/ai-delivery-orchestrator-worker"
          -var="ingress_log_group_arn=arn:aws:logs:us-east-1:${{ vars.AWS_ACCOUNT_ID }}:log-group:/ai-delivery-orchestrator/pilot/ingress"
          -var="operator_log_group_arn=arn:aws:logs:us-east-1:${{ vars.AWS_ACCOUNT_ID }}:log-group:/ai-delivery-orchestrator/pilot/operator-api"
          -var="worker_log_group_arn=arn:aws:logs:us-east-1:${{ vars.AWS_ACCOUNT_ID }}:log-group:/ai-delivery-orchestrator/pilot/worker"
      - name: Reject destructive pilot IAM plan
        if: ${{ inputs.provision_iam }}
        run: |
          set -euo pipefail
          destructive_changes="$(
            terraform -chdir=infra/environments/pilot-iam show -json pilot-iam.tfplan |
              jq -r '.resource_changes[]? | select(.change.actions | index("delete")) | "\(.address): \(.change.actions | join(","))"'
          )"
          if [ -n "$destructive_changes" ]; then
            echo "::error::Saved pilot IAM plan contains delete or replacement actions"
            printf '%s\n' "$destructive_changes"
            exit 1
          fi
          echo "Saved pilot IAM plan contains no delete or replacement actions."
      - name: Apply selected pilot IAM plan
        if: ${{ inputs.provision_iam }}
        run: terraform -chdir=infra/environments/pilot-iam apply -input=false -lock-timeout=5m pilot-iam.tfplan
      - name: Export provisioned IAM references
        if: ${{ inputs.provision_iam }}
        run: |
          echo "TF_VAR_runtime_secret_policy_arn=$(terraform -chdir=infra/environments/pilot-iam output -raw runtime_secret_policy_arn)" >> "$GITHUB_ENV"
          roles="$(terraform -chdir=infra/environments/pilot-iam output -json runtime_role_arns)"
          echo "TF_VAR_webhook_lambda_role_arn=$(jq -r .webhook <<< "$roles")" >> "$GITHUB_ENV"
          echo "TF_VAR_operator_lambda_role_arn=$(jq -r .operator_api <<< "$roles")" >> "$GITHUB_ENV"
          echo "TF_VAR_worker_execution_role_arn=$(jq -r .worker_execution <<< "$roles")" >> "$GITHUB_ENV"
          echo "TF_VAR_worker_task_role_arn=$(jq -r .worker <<< "$roles")" >> "$GITHUB_ENV"
          echo "TF_VAR_migration_execution_role_arn=$(jq -r .migration_execution <<< "$roles")" >> "$GITHUB_ENV"
          echo "TF_VAR_migration_task_role_arn=$(jq -r .migration <<< "$roles")" >> "$GITHUB_ENV"
      - name: Require configured IAM references
        if: ${{ ! inputs.provision_iam }}
        env:
          RUNTIME_SECRET_POLICY_ARN: ${{ vars.RUNTIME_SECRET_POLICY_ARN }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          echo "TF_VAR_runtime_secret_policy_arn=$RUNTIME_SECRET_POLICY_ARN" >> "$GITHUB_ENV"
          echo "TF_VAR_webhook_lambda_role_arn=arn:aws:iam::$AWS_ACCOUNT_ID:role/ai-delivery-orchestrator-pilot-webhook" >> "$GITHUB_ENV"
          echo "TF_VAR_operator_lambda_role_arn=arn:aws:iam::$AWS_ACCOUNT_ID:role/ai-delivery-orchestrator-pilot-operator-api" >> "$GITHUB_ENV"
          echo "TF_VAR_worker_execution_role_arn=arn:aws:iam::$AWS_ACCOUNT_ID:role/ai-delivery-orchestrator-pilot-worker-execution" >> "$GITHUB_ENV"
          echo "TF_VAR_worker_task_role_arn=arn:aws:iam::$AWS_ACCOUNT_ID:role/ai-delivery-orchestrator-pilot-worker" >> "$GITHUB_ENV"
          echo "TF_VAR_migration_execution_role_arn=arn:aws:iam::$AWS_ACCOUNT_ID:role/ai-delivery-orchestrator-pilot-migration-execution" >> "$GITHUB_ENV"
          echo "TF_VAR_migration_task_role_arn=arn:aws:iam::$AWS_ACCOUNT_ID:role/ai-delivery-orchestrator-pilot-migration" >> "$GITHUB_ENV"
      - name: Initialize pilot remote state
        run: terraform -chdir=infra/environments/pilot init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - name: Plan selected commit
        if: ${{ !inputs.bootstrap_ecr_repository && !inputs.replace_ecr_dkr_endpoint }}
        run: terraform -chdir=infra/environments/pilot plan -input=false -lock-timeout=5m -out=pilot.tfplan -var="aws_account_id=${{ vars.AWS_ACCOUNT_ID }}"
      - name: Plan only the approved ECR Docker endpoint replacement
        if: ${{ inputs.replace_ecr_dkr_endpoint }}
        run: >-
          terraform -chdir=infra/environments/pilot plan -input=false -lock-timeout=5m -out=pilot.tfplan
          -target='aws_vpc_endpoint.worker_interface["ecr.dkr"]'
          -replace='aws_vpc_endpoint.worker_interface["ecr.dkr"]'
          -var="aws_account_id=${{ vars.AWS_ACCOUNT_ID }}"
      - name: Reject destructive pilot plan
        if: ${{ !inputs.bootstrap_ecr_repository }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.replace_ecr_dkr_endpoint }}" = "true" ]; then
            replacement_changes="$(
              terraform -chdir=infra/environments/pilot show -json pilot.tfplan |
                jq -r '.resource_changes[]? | select(.change.actions != ["no-op"]) | "\(.address): \(.change.actions | join(","))"'
            )"
            test "$replacement_changes" = 'aws_vpc_endpoint.worker_interface["ecr.dkr"]: delete,create'
            echo "Saved pilot plan replaces only the approved ECR Docker interface endpoint."
            exit 0
          fi
          destructive_changes="$(
            terraform -chdir=infra/environments/pilot show -json pilot.tfplan |
              jq -r '
                def allowed_task_definition_replacement:
                  ((.address == "aws_ecs_task_definition.worker" or .address == "aws_ecs_task_definition.migration") and .change.actions == ["delete", "create"]);
                .resource_changes[]?
                | select(.change.actions | index("delete"))
                | select(allowed_task_definition_replacement | not)
                | "\(.address): \(.change.actions | join(","))"
              '
          )"
          if [ -n "$destructive_changes" ]; then
            echo "::error::Saved pilot plan contains delete or replacement actions"
            printf '%s\n' "$destructive_changes"
            exit 1
          fi
          echo "Saved pilot plan contains no unapproved delete or replacement actions."
      - name: Apply selected plan
        if: ${{ !inputs.bootstrap_ecr_repository }}
        run: terraform -chdir=infra/environments/pilot apply -input=false -lock-timeout=5m pilot.tfplan
      - name: Plan ECR bootstrap only
        if: ${{ inputs.bootstrap_ecr_repository }}
        run: terraform -chdir=infra/environments/pilot plan -input=false -lock-timeout=5m -target=aws_ecr_repository.worker -out=pilot-ecr-bootstrap.tfplan -var="aws_account_id=${{ vars.AWS_ACCOUNT_ID }}"
      - name: Require ECR-only bootstrap plan
        if: ${{ inputs.bootstrap_ecr_repository }}
        run: |
          changes="$(terraform -chdir=infra/environments/pilot show -json pilot-ecr-bootstrap.tfplan | jq -r '.resource_changes[]? | select(.change.actions != ["no-op"]) | .address')"
          test "$changes" = "aws_ecr_repository.worker"
      - name: Apply ECR bootstrap only
        if: ${{ inputs.bootstrap_ecr_repository }}
        run: terraform -chdir=infra/environments/pilot apply -input=false -lock-timeout=5m pilot-ecr-bootstrap.tfplan
      - name: Export concrete main-stack references
        if: ${{ inputs.provision_iam }}
        run: |
          set -euo pipefail
          database_secret_arn="$(terraform -chdir=infra/environments/pilot output -raw database_master_secret_arn)"
          webhook_secret_arn="$(terraform -chdir=infra/environments/pilot output -json application_secret_arns | jq -r '."github-webhook-secret"')"
          test "$database_secret_arn" != "null"
          test "$webhook_secret_arn" != "null"
          echo "TF_VAR_database_secret_arn=$database_secret_arn" >> "$GITHUB_ENV"
          echo "TF_VAR_webhook_secret_arn=$webhook_secret_arn" >> "$GITHUB_ENV"
      - name: Plan converged pilot IAM
        if: ${{ inputs.provision_iam }}
        run: >-
          terraform -chdir=infra/environments/pilot-iam plan -input=false -lock-timeout=5m -out=pilot-iam-converged.tfplan
          -var="aws_account_id=${{ vars.AWS_ACCOUNT_ID }}"
          -var="command_queue_arn=arn:aws:sqs:us-east-1:${{ vars.AWS_ACCOUNT_ID }}:ai-delivery-orchestrator-pilot-commands.fifo"
          -var="callback_queue_arn=arn:aws:sqs:us-east-1:${{ vars.AWS_ACCOUNT_ID }}:ai-delivery-orchestrator-pilot-callbacks.fifo"
          -var="coordination_table_arn=arn:aws:dynamodb:us-east-1:${{ vars.AWS_ACCOUNT_ID }}:table/ai-delivery-orchestrator-pilot-coordination"
          -var="worker_ecr_repository_arn=arn:aws:ecr:us-east-1:${{ vars.AWS_ACCOUNT_ID }}:repository/ai-delivery-orchestrator-worker"
          -var="ingress_log_group_arn=arn:aws:logs:us-east-1:${{ vars.AWS_ACCOUNT_ID }}:log-group:/ai-delivery-orchestrator/pilot/ingress"
          -var="operator_log_group_arn=arn:aws:logs:us-east-1:${{ vars.AWS_ACCOUNT_ID }}:log-group:/ai-delivery-orchestrator/pilot/operator-api"
          -var="worker_log_group_arn=arn:aws:logs:us-east-1:${{ vars.AWS_ACCOUNT_ID }}:log-group:/ai-delivery-orchestrator/pilot/worker"
      - name: Reject destructive converged pilot IAM plan
        if: ${{ inputs.provision_iam }}
        run: |
          set -euo pipefail
          destructive_changes="$(
            terraform -chdir=infra/environments/pilot-iam show -json pilot-iam-converged.tfplan |
              jq -r '.resource_changes[]? | select(.change.actions | index("delete")) | "\(.address): \(.change.actions | join(","))"'
          )"
          if [ -n "$destructive_changes" ]; then
            echo "::error::Saved converged pilot IAM plan contains delete or replacement actions"
            printf '%s\n' "$destructive_changes"
            exit 1
          fi
          echo "Saved converged pilot IAM plan contains no delete or replacement actions."
      - name: Apply converged pilot IAM plan
        if: ${{ inputs.provision_iam }}
        run: terraform -chdir=infra/environments/pilot-iam apply -input=false -lock-timeout=5m pilot-iam-converged.tfplan
